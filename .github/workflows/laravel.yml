name: Laravel CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, sqlite3
        coverage: none

    - name: Prepare Environment File
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      # --ignore-platform-req=php mencegah error jika composer.lock mengunci versi patch PHP spesifik
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-req=php

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Prepare SQLite Database File
      # Buat file database fisik agar skema tabel tersimpan untuk step testing
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache database

    - name: Run Database Migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      run: php artisan migrate --force

    - name: Run Feature & Unit Tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      run: php artisan test
